services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pulse_racing
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
    ports:
      - "5432:5432"
    volumes:
      - pulse-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse_racing"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pulse-postgres:
